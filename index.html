<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسابقة الزرافات — مشاهدة الحلول حسب المستوى</title>
  <meta name="description" content="واجهة أنيقة لعرض حلول مسابقة الزرافات حسب المستويات مع فيديوهات مدمجة من Google Drive.">
  <meta name="theme-color" content="#f59e0b">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .hero{ animation: float 3s ease-in-out infinite; }
    .level-card{ transition: transform .3s ease, box-shadow .3s ease; }
    .level-card:hover{ transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .video-container{ position:relative; width:100%; padding-bottom:56.25%; background:#000; border-radius:12px; overflow:hidden; }
    .video-container iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
    .dropdown-content{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
    .rotate-180{ transform: rotate(180deg); }
    .badge-amber{
      background-image: linear-gradient(135deg, #fbbf24, #f97316);
      color:#fff;
      box-shadow: 0 8px 24px rgba(249,115,22,.35), inset 0 1px 0 rgba(255,255,255,.35);
    }
    @media (prefers-reduced-motion: reduce){
      .hero{ animation:none !important; }
      .level-card, .dropdown-content{ transition: none !important; }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-yellow-100 via-orange-100 to-amber-200 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <header class="text-center mb-10">
      <div class="hero text-8xl mb-3" aria-hidden="true">🦒</div>
      <h1 class="text-5xl font-bold text-amber-900 mb-2">مسابقة الزرافات</h1>
      <p class="text-xl text-amber-700">اختر المستوى لمشاهدة الحل</p>
    </header>

    <div class="max-w-4xl mx-auto space-y-4" id="levels">
      <!-- Level 1 -->
      <div class="level-card bg-white rounded-2xl shadow-lg overflow-hidden">
        <button type="button" class="w-full p-6 flex items-center justify-between hover:bg-amber-50 transition-colors"
                aria-expanded="false" aria-controls="level1" data-target="level1" onclick="toggleLevel('level1')">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-bold shadow-lg badge-amber">1</div>
            <div class="text-right">
              <h2 class="text-2xl font-bold text-amber-900">المستوى الأول</h2>
              <p class="text-amber-700">الانطلاقة الأولى</p>
            </div>
          </div>
          <svg id="arrow-level1" class="w-8 h-8 text-amber-700 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="level1" class="dropdown-content px-6 pb-6" role="region" aria-labelledby="arrow-level1">
          <div class="video-container">
            <iframe title="حل المستوى الأول (Google Drive)" src="https://drive.google.com/file/d/1VBKHw1VdNYM57MHCC5Wo51s0HCUG0kV1/preview" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="mt-3 text-sm text-amber-800">
            <a class="underline hover:no-underline" href="https://drive.google.com/file/d/1VBKHw1VdNYM57MHCC5Wo51s0HCUG0kV1/view?usp=sharing" target="_blank" rel="noopener">فتح الفيديو في تبويب جديد</a>
          </div>
        </div>
      </div>

      <!-- Level 2 -->
      <div class="level-card bg-white rounded-2xl shadow-lg overflow-hidden">
        <button type="button" class="w-full p-6 flex items-center justify-between hover:bg-amber-50 transition-colors"
                aria-expanded="false" aria-controls="level2" data-target="level2" onclick="toggleLevel('level2')">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-bold shadow-lg badge-amber">2</div>
            <div class="text-right">
              <h2 class="text-2xl font-bold text-amber-900">المستوى الثاني</h2>
              <p class="text-amber-700">تحديات ممتعة</p>
            </div>
          </div>
          <svg id="arrow-level2" class="w-8 h-8 text-amber-700 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="level2" class="dropdown-content px-6 pb-6" role="region" aria-labelledby="arrow-level2">
          <div class="video-container">
            <iframe title="حل المستوى الثاني (Google Drive)" src="https://drive.google.com/file/d/1E7KVrfch0x-ilbrlpe3GsG95Et-PkO6O/preview" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="mt-3 text-sm text-amber-800">
            <a class="underline hover:no-underline" href="https://drive.google.com/file/d/1E7KVrfch0x-ilbrlpe3GsG95Et-PkO6O/view?usp=sharing" target="_blank" rel="noopener">فتح الفيديو في تبويب جديد</a>
          </div>
        </div>
      </div>

      <!-- Level 3 -->
      <div class="level-card bg-white rounded-2xl shadow-lg overflow-hidden">
        <button type="button" class="w-full p-6 flex items-center justify-between hover:bg-amber-50 transition-colors"
                aria-expanded="false" aria-controls="level3" data-target="level3" onclick="toggleLevel('level3')">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-bold shadow-lg badge-amber">3</div>
            <div class="text-right">
              <h2 class="text-2xl font-bold text-amber-900">المستوى الثالث</h2>
              <p class="text-amber-700">المغامرة تزداد</p>
            </div>
          </div>
          <svg id="arrow-level3" class="w-8 h-8 text-amber-700 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="level3" class="dropdown-content px-6 pb-6" role="region" aria-labelledby="arrow-level3">
          <div class="video-container">
            <iframe title="حل المستوى الثالث (Google Drive)" src="https://drive.google.com/file/d/1fz77WeZYJ7txuHGfNXASWO3tjHmMQlbM/preview" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="mt-3 text-sm text-amber-800">
            <a class="underline hover:no-underline" href="https://drive.google.com/file/d/1fz77WeZYJ7txuHGfNXASWO3tjHmMQlbM/view?usp=sharing" target="_blank" rel="noopener">فتح الفيديو في تبويب جديد</a>
          </div>
        </div>
      </div>

      <!-- Level 4 -->
      <div class="level-card bg-white rounded-2xl shadow-lg overflow-hidden">
        <button type="button" class="w-full p-6 flex items-center justify-between hover:bg-amber-50 transition-colors"
                aria-expanded="false" aria-controls="level4" data-target="level4" onclick="toggleLevel('level4')">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-bold shadow-lg badge-amber">4</div>
            <div class="text-right">
              <h2 class="text-2xl font-bold text-amber-900">المستوى الرابع</h2>
              <p class="text-amber-700">القمة!</p>
            </div>
          </div>
          <svg id="arrow-level4" class="w-8 h-8 text-amber-700 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="level4" class="dropdown-content px-6 pb-6" role="region" aria-labelledby="arrow-level4">
          <div class="video-container">
            <iframe title="حل المستوى الرابع (Google Drive)" src="https://drive.google.com/file/d/1DP2Kia7r-3y3DV5zzceslJHzlUqiRv0B/preview" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="mt-3 text-sm text-amber-800">
            <a class="underline hover:no-underline" href="https://drive.google.com/file/d/1DP2Kia7r-3y3DV5zzceslJHzlUqiRv0B/view?usp=sharing" target="_blank" rel="noopener">فتح الفيديو في تبويب جديد</a>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center mt-12 text-amber-800">
      <p class="text-lg">استمتع باللعب وواصل لأعلى المستويات! 🦒</p>
      <p class="mt-2 text-sm font-semibold">شرح : الأستاذ عبد الهادي المنتشري</p>
    </footer>
  </div>

  <script>
    function toggleLevel(levelId){
      const content = document.getElementById(levelId);
      const arrow = document.getElementById('arrow-' + levelId);
      const btn = document.querySelector('button[data-target="' + levelId + '"]');
      const isOpen = content.style.maxHeight && content.style.maxHeight !== '0px';

      document.querySelectorAll('.dropdown-content').forEach(el => { el.style.maxHeight = null; });
      document.querySelectorAll('[id^="arrow-"]').forEach(a => { a.classList.remove('rotate-180'); });
      document.querySelectorAll('button[data-target]').forEach(b => b.setAttribute('aria-expanded','false'));

      if(!isOpen){
        content.style.maxHeight = content.scrollHeight + 'px';
        arrow.classList.add('rotate-180');
        btn.setAttribute('aria-expanded','true');
      }
    }

    window.addEventListener('resize', () => {
      const open = document.querySelector('.dropdown-content[style*="max-height"]');
      if(open){
        open.style.maxHeight = open.scrollHeight + 'px';
      }
    });
  </script>
</body>
</html>
